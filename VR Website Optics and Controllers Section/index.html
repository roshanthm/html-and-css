<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Website - Optics & Controllers</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ✅ Container -->
  <div class="container py-5">

    <!-- ✅ Row 1 -->
    <div class="row justify-content-center align-items-center mb-5">
      <!-- Text Section -->
      <div class="col-md-6 order-md-1 text-section">
        <h2 class="title">Improved Optics</h2>
        <p class="description">
          A virtual reality headset is a head-mounted device that provides virtual reality for the wearer.
        </p>
        <button class="btn btn-dark read-more">Read More</button>
      </div>

      <!-- Image Section -->
      <div class="col-md-6 order-md-2 text-center">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/vr-optics-img.png"
             alt="VR Optics" class="img-fluid vr-image" />
      </div>
    </div>

    <!-- ✅ Row 2 -->
    <div class="row justify-content-center align-items-center">
      <!-- Image Section -->
      <div class="col-md-6 order-md-1 text-center">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/vr-controllers-img.png"
             alt="VR Controllers" class="img-fluid vr-image" />
      </div>

      <!-- Text Section -->
      <div class="col-md-6 order-md-2 text-section">
        <h2 class="title">Two Touch Controllers</h2>
        <p class="description">
          Your Oculus Touch controllers are a pair of tracked controllers that give you a hand.
        </p>
        <button class="btn btn-dark read-more">Read More</button>
      </div>
    </div>

  </div>

</body>
</html>
