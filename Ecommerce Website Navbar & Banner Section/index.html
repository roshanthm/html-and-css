<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecommerce Navbar & Banner</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-website-logo-img.png"
             alt="Ecommerce Logo"
             class="logo me-2" />
        <span class="fw-bold text-primary">Fly</span><span class="fw-bold text-danger"> Buy</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Explore Deals & Offers</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Trending Blogs</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ✅ Banner Carousel -->
  <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

      <!-- ✅ Slide 1 -->
      <div class="carousel-item active">
        <picture>
          <!-- Small Devices -->
          <source media="(max-width: 767px)" srcset="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-carousel-1-sm-img.png" />
          <!-- Medium and Larger -->
          <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-carousel-1-img.png"
               class="d-block w-100 banner-img"
               alt="Diwali Banner 1" />
        </picture>
      </div>

      <!-- ✅ Slide 2 -->
      <div class="carousel-item">
        <picture>
          <source media="(max-width: 767px)" srcset="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-carousel-2-sm-img.png" />
          <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-carousel-2-img.png"
               class="d-block w-100 banner-img"
               alt="Diwali Banner 2" />
        </picture>
      </div>

      <!-- ✅ Slide 3 -->
      <div class="carousel-item">
        <picture>
          <source media="(max-width: 767px)" srcset="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-carousel-3-sm-img.png" />
          <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-carousel-3-img.png"
               class="d-block w-100 banner-img"
               alt="Diwali Banner 3" />
        </picture>
      </div>
    </div>

    <!-- ✅ Carousel Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>

    <!-- ✅ Carousel Indicators -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="2"></button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
