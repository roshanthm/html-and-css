<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Done Section</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons (for arrow icon) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ✅ Work Done Section -->
  <div class="work-done-container text-center d-flex align-items-center">
    <div class="container py-5">
      <div class="row text-white">
        
        <!-- ✅ Projects Completed -->
        <div class="col-12 col-md-4 mb-4 mb-md-0">
          <i class="bi bi-hand-thumbs-up display-5"></i>
          <hr class="custom-line mx-auto" />
          <h3 class="fw-bold">10</h3>
          <p class="mb-0">Projects Completed</p>
        </div>

        <!-- ✅ Lines of Code -->
        <div class="col-12 col-md-4 mb-4 mb-md-0">
          <i class="bi bi-file-text display-5"></i>
          <hr class="custom-line mx-auto" />
          <h3 class="fw-bold">2,800</h3>
          <p class="mb-0">Lines of Code</p>
        </div>

        <!-- ✅ Hours Worked -->
        <div class="col-12 col-md-4">
          <i class="bi bi-clock display-5"></i>
          <hr class="custom-line mx-auto" />
          <h3 class="fw-bold">15</h3>
          <p class="mb-0">Hours Worked</p>
        </div>
      </div>

      <!-- ✅ Arrow Bootstrap Icon below -->
      <div class="mt-4">
        <i class="bi bi-arrow-right text-white fs-4"></i>
      </div>
    </div>
  </div>

</body>
</html>
