<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Tool Landing Page</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0c0521;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img
          src="https://assets.ccbp.in/frontend/responsive-website/landing-section-design-logo-img.png"
          alt="Design Logo"
          width="40"
          class="mr-2"
        />
        <span class="font-weight-bold text-light">Design</span>
      </a>

      <!-- ✅ Toggler -->
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- ✅ Collapsible menu with ml-auto -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contacts</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ✅ Hero Section with Background Image -->
  <section class="hero-section text-center d-flex flex-column justify-content-center align-items-center">
    <div class="container">
      <h1 class="text-white font-weight-bold mb-4">
        The most <span class="text-highlight">flexible</span> web design tool
      </h1>
      <p class="text-white-50 mb-4">
        We've done it carefully and simply, Combined with the ingredients makes for
        beautiful landings. It is the tool you need to speed up your design process.
      </p>
      <div>
        <button class="btn btn-warning text-dark font-weight-semibold rounded-pill px-4 py-2 mr-2">Sign Up</button>
        <button class="btn btn-outline-light font-weight-semibold rounded-pill px-4 py-2">Learn More</button>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
