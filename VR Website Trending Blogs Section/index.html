<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Website - Trending Blogs</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ✅ Main Container -->
  <div class="container py-5">
    <h1 class="section-title mb-4">Trending Blogs</h1>

    <!-- ✅ Blogs Row -->
    <div class="row justify-content-center justify-content-md-between g-4">
      
      <!-- ✅ Blog Card 1 -->
      <div class="col-md-5 shadow rounded-3 p-0">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/vr-trending-blogs-1-img.png"
             alt="VR Blog 1" class="img-fluid rounded-top" />
        <div class="p-3">
          <p class="blog-category">Amazon</p>
          <h5 class="blog-title">New Way to See the World. It is a simulated experience that can be completely different from the real world.</h5>
          <a href="#" class="read-more">READ MORE →</a>
        </div>
      </div>

      <!-- ✅ Blog Card 2 -->
      <div class="col-md-5 shadow rounded-3 p-0">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/vr-trending-blogs-2-img.png"
             alt="VR Blog 2" class="img-fluid rounded-top" />
        <div class="p-3">
          <p class="blog-category">Advertising</p>
          <h5 class="blog-title">The best one for you. Come experience the wonder of Google Earth in virtual reality.</h5>
          <a href="#" class="read-more">READ MORE →</a>
        </div>
      </div>
    </div>

    <!-- ✅ View All Button -->
    <div class="row justify-content-end mt-4">
      <div class="col-auto">
        <button class="btn btn-view-all">View All</button>
      </div>
    </div>

  </div>

</body>
</html>
