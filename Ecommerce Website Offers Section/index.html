<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecommerce Offers Section</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ✅ Offers Section -->
  <div class="offers-section py-5">
    <div class="container">
      <div class="row align-items-center">

        <!-- ✅ Left Content -->
        <div class="col-12 col-md-6 order-md-1 text-center text-md-start text-white mb-4 mb-md-0">
          <h2 class="fw-bold mb-3">BEST NEW YEAR SPECIAL OFFERS</h2>
          <p class="fs-5 mb-2">
            Best time to buy. Save upto <span class="fw-semibold fst-italic">70% cash</span>
          </p>
          <p class="text-warning fs-5 mb-3">
            <span class="fw-bold">10% INSTANT DISCOUNT</span> * <br />
            <span class="text-white fs-6">with SBI Credit Cards*</span>
          </p>
          <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-offers-credit-card-img.png"
               alt="SBI Credit Card"
               class="offer-card-img mt-2" />
        </div>

        <!-- ✅ Right Image -->
        <div class="col-12 col-md-6 order-md-2 text-center">
          <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-offers-special-img.png"
               alt="Special Offer"
               class="offer-special-img mb-3" />
          <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/ecommerce-offers-appliances-img.png"
               alt="Appliances"
               class="offer-appliances-img img-fluid" />
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
