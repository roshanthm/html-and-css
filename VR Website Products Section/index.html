<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Website - Products Section</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ✅ Container -->
  <div class="container py-5">
    <h1 class="section-title mb-4">Products</h1>

    <!-- ✅ Products Row -->
    <div class="row g-4">

      <!-- Product 1 -->
      <div class="col-md-6">
        <div class="product-card d-flex flex-column justify-content-end"
             style="background-image: url('https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/vr-products-headset-img.png');">
          <div class="product-info p-3">
            <h4 class="product-name">VR Headset</h4>
            <p class="product-price">Rs 75,000</p>
            <button class="btn btn-outline-light">Buy Now</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-md-6">
        <div class="product-card d-flex flex-column justify-content-end"
             style="background-image: url('https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/vr-products-headset-with-controllers-img.png');">
          <div class="product-info p-3">
            <h4 class="product-name">VR Headset and Two Touch Controllers</h4>
            <p class="product-price">Rs 90,000</p>
            <button class="btn btn-outline-light">Buy Now</button>
          </div>
        </div>
      </div>

    </div>

    <!-- ✅ View All Button -->
    <div class="row justify-content-end mt-4">
      <div class="col-auto">
        <button class="btn btn-view-all">View All</button>
      </div>
    </div>
  </div>

</body>
</html>
