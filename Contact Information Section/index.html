<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Contact Info</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-contact text-white">

  <!-- ✅ Contact Section -->
  <div class="container py-5">
    <div class="row d-flex flex-row align-items-start">

      <!-- ✅ Profile Column -->
      <div class="col-12 col-md-3 text-center text-md-start mb-4 mb-md-0">
        <img src="https://d2clawv67efefq.cloudfront.net/ccbp-responsive-website/portfolio-about-me-img.png"
             alt="Profile"
             class="rounded-circle contact-img mb-3" />
        <h4 class="text-highlight fw-bold">Jenny</h4>
        <p class="text-muted mb-0">Frontend Developer</p>
      </div>

      <!-- ✅ Phone Column -->
      <div class="col-12 col-md-3 mb-4 mb-md-0">
        <h5 class="text-highlight fw-bold">Phone No.</h5>
        <div class="d-flex align-items-center">
          <i class="bi bi-telephone text-muted me-2"></i>
          <p class="text-muted mb-0">9876543210</p>
        </div>
      </div>

      <!-- ✅ Email Column -->
      <div class="col-12 col-md-3 mb-4 mb-md-0">
        <h5 class="text-highlight fw-bold">E-mail</h5>
        <div class="d-flex align-items-center">
          <i class="bi bi-envelope text-muted me-2"></i>
          <p class="text-muted mb-0">jenny3@gmail.com</p>
        </div>
      </div>

      <!-- ✅ Address Column -->
      <div class="col-12 col-md-3">
        <h5 class="text-highlight fw-bold">Address</h5>
        <div class="d-flex align-items-center">
          <i class="bi bi-geo-alt text-muted me-2"></i>
          <p class="text-muted mb-0">17 Ayur Vigyan Nagar, New Delhi, India.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Footer -->
  <footer class="text-center py-3 footer-text">
    <i class="bi bi-c-circle me-1"></i>2020 by Jenny Wilson. Created with Bootstrap.
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
