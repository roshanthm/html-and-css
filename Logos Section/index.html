<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Logos Section</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ✅ Container-fluid wrapper -->
  <div class="container-fluid py-5 bg-light">
    <h1 class="text-center mb-4">Used by and seen on</h1>

    <!-- ✅ Row container -->
    <div class="row justify-content-center align-items-center text-center">

      <!-- ✅ Six brand logos inside col-md-* -->
      <div class="col-4 col-md-2 mb-4">
        <img src="https://assets.ccbp.in/frontend/responsive-website/slack-img.png" alt="Slack" class="img-fluid brand-logo" />
      </div>
      <div class="col-4 col-md-2 mb-4">
        <img src="https://assets.ccbp.in/frontend/responsive-website/netflix-img.png" alt="Netflix" class="img-fluid brand-logo" />
      </div>
      <div class="col-4 col-md-2 mb-4">
        <img src="https://assets.ccbp.in/frontend/responsive-website/fitbit-img.png" alt="Fitbit" class="img-fluid brand-logo" />
      </div>
      <div class="col-4 col-md-2 mb-4">
        <img src="https://assets.ccbp.in/frontend/responsive-website/google-img.png" alt="Google" class="img-fluid brand-logo" />
      </div>
      <div class="col-4 col-md-2 mb-4">
        <img src="https://assets.ccbp.in/frontend/responsive-website/airbnb-img.png" alt="Airbnb" class="img-fluid brand-logo" />
      </div>
      <div class="col-4 col-md-2 mb-4">
        <img src="https://assets.ccbp.in/frontend/responsive-website/uber-img.png" alt="Uber" class="img-fluid brand-logo" />
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
